<div class="pagina">
  <div class="folha-area">
    <div class="folha-sombra" aria-hidden="true"></div>
    <div class="folha" id="conteudo">

      <div class="cabeca">
        <div class="cabeca-txt">
          <h1>Minha Agenda de Aulas</h1>
          <p class="legenda">Acompanhe os hor&aacute;rios das suas aulas confirmadas e solicite novos hor&aacute;rios dispon&iacute;veis.</p>
        </div>
      </div>

      <div class="proxima">
        <div class="proxima-txt">
          <p class="proxima-rot">Sua pr&oacute;xima aula</p>
          <p class="proxima-quando"></p>
          <p class="proxima-onde"></p>
        </div>
        <div class="proxima-acao">
          <a class="pbotao" href="#" data-acao="sala" data-link="">Entrar na sala virtual</a>
        </div>
      </div>

      <h2 class="secao">Hor&aacute;rios da semana</h2>

      <table class="grade">
        <caption class="oculto"></caption>
        <thead></thead>
        <tbody id="grade-aluno"></tbody>
      </table>

      <h2 class="secao">Solicitar agendamento ou reagendamento</h2>

      <form class="bloco-form" action="#" method="post" id="form-solicitacao">
        <div class="duas">
          <div class="esq">
            <div class="campo-p">
              <label for="data-pretendida">Data pretendida</label>
              <input type="date" id="data-pretendida" name="data-pretendida">
            </div>
          </div>
          <div class="dir">
            <div class="campo-p">
              <label for="horario-livre">Hor&aacute;rio dispon&iacute;vel</label>
              <select id="horario-livre" name="horario-livre"></select>
            </div>
          </div>
        </div>

        <div class="campo-p campo-largo">
          <label for="observacao">Observa&ccedil;&atilde;o / motivo (opcional)</label>
          <input type="text" id="observacao" name="observacao" placeholder="Ex: Gostaria de reposi&ccedil;&atilde;o da aula anterior ou treino de conversa&ccedil;&atilde;o.">
        </div>

        <button class="pbotao pbotao-largo" type="submit">Enviar solicita&ccedil;&atilde;o &agrave; professora</button>
      </form>

    </div>
  </div>
